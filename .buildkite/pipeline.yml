steps:
  # ── CPU smoke test ──────────────────────────────────────────────────────────
  # Run the NTuplePauliString unit tests on plain CPU agents first so a basic
  # regression is caught cheaply before we queue a GPU agent.
  - label: ":julia: CPU – NTuplePauliString (Julia {{matrix.version}})"
    key: cpu-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                            using Pkg; Pkg.instantiate()'
      julia --project=. test/test_ntuple_pauli_string.jl
    agents:
      queue: "juliagpu"
    timeout_in_minutes: 30

  # ── CUDA integration test ───────────────────────────────────────────────────
  # Exercises NTuplePauliString end-to-end on real GPU hardware via the
  # PauliPropagationCUDA extension. Depends on CPU tests passing first.
  - label: ":nvidia: CUDA – NTuplePauliString (Julia {{matrix.version}})"
    key: cuda-ntuple
    depends_on: cpu-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
            - ext
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project with CUDA")
                            using Pkg; Pkg.instantiate()'
      julia --project=. test/test_ntuple_pauli_string_cuda.jl
    agents:
      queue: "juliagpu"
      cuda: "*"
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 1   # keep the pipeline green on driver mismatches

  # ── Full test suite ─────────────────────────────────────────────────────────
  # Runs the entire test/runtests.jl on a GPU agent to confirm nothing in the
  # wider package regressed.
  - label: ":julia: Full test suite (Julia {{matrix.version}})"
    key: full-tests
    depends_on: cuda-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
    command: |
      julia --project=. -e 'println("--- :julia: Instantiating project")
                            using Pkg; Pkg.instantiate()'
      julia --project=. -e 'using Pkg; Pkg.test()'
    agents:
      queue: "juliagpu"
      cuda: "*"
    timeout_in_minutes: 90