steps:
  # CPU smoke test: run NTuplePauliString unit tests on a plain CPU agent first
  # so basic regressions are caught cheaply before queuing a GPU agent.
  - label: ":julia: CPU - NTuplePauliString (Julia {{matrix.version}})"
    key: cpu-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
    command: |
      julia --project=. -e 'using Pkg; Pkg.instantiate()'
      julia --project=. test/test_ntuple_pauli_string.jl
    agents:
      queue: "juliagpu"
    timeout_in_minutes: 30

  # CUDA integration test: exercises NTuplePauliString end-to-end on real GPU
  # hardware via the PauliPropagationCUDA extension.
  # CUDA.jl is a weakdep so it is not installed by Pkg.instantiate() by default;
  # we add it explicitly here before running the test.
  - label: ":nvidia: CUDA - NTuplePauliString (Julia {{matrix.version}})"
    key: cuda-ntuple
    depends_on: cpu-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
            - ext
    command: |
      julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add("CUDA")'
      julia --project=. test/test_ntuple_pauli_string_cuda.jl
    agents:
      queue: "juliagpu"
      cuda: "*"
    timeout_in_minutes: 60
    soft_fail:
      - exit_status: 1

  # Full test suite: runs test/runtests.jl on a GPU agent to confirm nothing
  # in the wider package regressed.
  - label: ":julia: Full test suite (Julia {{matrix.version}})"
    key: full-tests
    depends_on: cuda-ntuple
    matrix:
      setup:
        version:
          - "1.10"
          - "1.11"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
      - JuliaCI/julia-coverage#v1:
          codecov: true
          dirs:
            - src
    command: |
      julia --project=. -e 'using Pkg; Pkg.instantiate()'
      julia --project=. -e 'using Pkg; Pkg.test()'
    agents:
      queue: "juliagpu"
      cuda: "*"
    timeout_in_minutes: 90