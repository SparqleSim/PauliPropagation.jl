# .github/workflows/ci.yml
#
# Runs the full CPU test suite on every push and pull-request.
# Includes the NTuplePauliString unit tests (test/test_ntuple_pauli_string.jl)
# which were added in the GPU-compatible-long-integer-types branch.
#
# GPU tests are handled separately by the JuliaGPU Buildkite pipeline
# (.buildkite/pipeline.yml) which has access to real CUDA hardware.

name: CI

on:
  push:
    branches:
      - main
      - dev
      - GPU-compatible-long-interger-types
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} – ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"   # minimum supported (see [compat] in Project.toml)
          - "1.11"
          - "1"      # latest stable
        os:
          - ubuntu-latest
        include:
          # also smoke-test on macOS and Windows with latest stable only
          - version: "1"
            os: macos-latest
          - version: "1"
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Julia ${{ matrix.version }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Restore Julia package cache
        uses: julia-actions/cache@v2

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        # julia-runtest calls `Pkg.test()` which runs test/runtests.jl.
        # test_ntuple_pauli_string.jl is now included there so it runs
        # automatically on every CI invocation without any extra flags.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
